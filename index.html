<style>
  :root {
    --chalk-pink: #f4c9d6;
    --chalk-green: #b8dcc4;
    --chalk-beige: #ecdfc8;
    --board-bg: #33463c;
    --board-bg-2: #3c5147;
    --frame-wood: #7a5233;
    --frame-wood-dark: #5e3f27;
    --chalk-white: #f6f3ec;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Patrick Hand', sans-serif;
    background: #1c2620;
    color: var(--chalk-white);
    margin: 0;
    padding: 28px 14px;
    display: flex;
    justify-content: center;
  }
  .frame {
    width: 100%;
    max-width: 440px;
    background: var(--frame-wood);
    background-image:
      repeating-linear-gradient(90deg, var(--frame-wood) 0px, var(--frame-wood-dark) 2px, var(--frame-wood) 6px);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .board {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.05), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.04), transparent 55%),
      var(--board-bg);
    border-radius: 8px;
    border: 2px solid rgba(0,0,0,0.25);
    padding: 22px 18px 26px;
  }
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 0 6px;
  }
  .logo-slot {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px solid var(--chalk-beige);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--chalk-green);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .logo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  h1 {
    font-family: 'Caveat', cursive;
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    text-align: center;
    letter-spacing: 0.5px;
    text-shadow: 0 0 1px rgba(246,243,236,0.3);
  }
  .subline {
    text-align: center;
    font-size: 13px;
    color: var(--chalk-beige);
    opacity: 0.75;
    margin: 0 0 18px;
  }
  .chalk-divider {
    border: none;
    border-top: 2px dashed rgba(246,243,236,0.25);
    margin: 0 0 18px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  #item-input {
    flex: 1;
    padding: 10px 12px;
    font-size: 17px;
    font-family: 'Patrick Hand', sans-serif;
    border: 2px solid var(--chalk-beige);
    border-radius: 10px;
    outline: none;
    background: rgba(246,243,236,0.08);
    color: var(--chalk-white);
  }
  #item-input::placeholder { color: rgba(246,243,236,0.45); }
  #item-input:focus {
    border-color: var(--chalk-pink);
    box-shadow: 0 0 0 2px rgba(244,201,214,0.2);
  }
  #add-btn {
    padding: 10px 18px;
    font-size: 20px;
    font-family: 'Patrick Hand', sans-serif;
    background: var(--chalk-pink);
    color: #4a2a34;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #add-btn:active { transform: scale(0.96); }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 15px;
    color: var(--chalk-beige);
  }
  #clear-btn {
    background: none;
    border: 2px solid var(--chalk-green);
    color: var(--chalk-green);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 14px;
    font-family: 'Patrick Hand', sans-serif;
    cursor: pointer;
  }
  #clear-btn:active { transform: scale(0.96); }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(246,243,236,0.06);
    border: 2px dashed rgba(246,243,236,0.3);
    border-radius: 10px;
  }
  .check {
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 50%;
    border: 2px solid var(--chalk-beige);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #33463c;
    font-size: 14px;
    padding: 0;
  }
  .check.done {
    background: var(--chalk-green);
    border-color: var(--chalk-green);
  }
  .item-name {
    flex: 1;
    font-size: 18px;
  }
  .item-name.done {
    color: rgba(246,243,236,0.4);
    text-decoration: line-through;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--chalk-pink);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    font-family: 'Patrick Hand', sans-serif;
  }
  #empty-msg {
    text-align: center;
    color: rgba(246,243,236,0.5);
    font-size: 16px;
    padding: 36px 0;
  }
</style>
</head>

      <h1>Lista del supermercado</h1>
    </div>
    <p class="subline">Anota, marca y no olvides nada</p>
    <hr class="chalk-divider">

    <div class="input-row">
      <input id="item-input" type="text" placeholder="Ej: leche, pan, huevos" autocomplete="off" />
      <button id="add-btn">+</button>
    </div>

    <div class="toolbar">
      <span id="count-label">0 productos</span>
      <button id="clear-btn">Vaciar comprados</button>
    </div>

    <ul id="list"></ul>
    <p id="empty-msg" style="display:none;">Tu lista está vacía. Agrega tu primer producto arriba.</p>
  </div>
</div>

<script>
let items = JSON.parse(localStorage.getItem('lista-supermercado') || '[]');

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Los navegadores móviles (sobre todo iOS) bloquean el audio hasta que hay
// un gesto directo del usuario. Desbloqueamos el contexto en la primera
// interacción y cargamos los clips como buffers de Web Audio, que sí
// reproducen de forma confiable en celular.
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const ctx = getAudioCtx();
  const buffer = ctx.createBuffer(1, 1, 22050);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start(0);
}
['touchstart', 'mousedown', 'keydown'].forEach((evt) => {
  document.addEventListener(evt, unlockAudio, { once: true, passive: true });
});

const soundBuffers = {};
function loadSoundBuffer(name, url) {
  fetch(url)
    .then((res) => res.arrayBuffer())
    .then((data) => getAudioCtx().decodeAudioData(data))
    .then((buffer) => { soundBuffers[name] = buffer; })
    .catch(() => {});
}
loadSoundBuffer('bip', 'sounds/otter-bip.mp3');
loadSoundBuffer('complete', 'sounds/otter-complete.mp3');

function playBuffer(name, gainValue) {
  const buffer = soundBuffers[name];
  const ctx = getAudioCtx();
  if (!buffer) return;
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  gain.gain.value = gainValue != null ? gainValue : 1;
  src.buffer = buffer;
  src.connect(gain);
  gain.connect(ctx.destination);
  src.start(0);
}

function playTone(freq, start, duration, type, peakGain) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.18, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playOtterBip() {
  getAudioCtx();
  playBuffer('bip', 0.9);
}

function playOtterComplete() {
  getAudioCtx();
  playBuffer('complete', 1);
}

function playTap() {
  playOtterBip();
}

function playAdd() {
  playTone(520, 0, 0.09, 'sine', 0.15);
  playTone(780, 0.06, 0.1, 'sine', 0.13);
}

function playDelete() {
  playTone(340, 0, 0.1, 'triangle', 0.12);
}

function playComplete() {
  playOtterComplete();
}

function save() {
  localStorage.setItem('lista-supermercado', JSON.stringify(items));
}

function render() {
  const list = document.getElementById('list');
  const emptyMsg = document.getElementById('empty-msg');
  const countLabel = document.getElementById('count-label');
  list.innerHTML = '';

  emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

  const pending = items.filter(i => !i.done).length;
  countLabel.textContent = pending + ' de ' + items.length + ' pendientes';

  items.forEach((item, idx) => {
    const li = document.createElement('li');

    const check = document.createElement('button');
    check.className = 'check' + (item.done ? ' done' : '');
    check.innerHTML = item.done ? '&#10003;' : '';
    check.onclick = () => {
      const nowDone = !items[idx].done;
      items[idx].done = nowDone;
      save();
      render();
      if (nowDone) {
        playTap();
      }
    };

    const name = document.createElement('span');
    name.className = 'item-name' + (item.done ? ' done' : '');
    name.textContent = item.name;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '&#10005;';
    del.onclick = () => { items.splice(idx, 1); save(); render(); playDelete(); };

    li.appendChild(check);
    li.appendChild(name);
    li.appendChild(del);
    list.appendChild(li);
  });
}

function addItem() {
  const input = document.getElementById('item-input');
  const value = input.value.trim();
  if (!value) return;
  items.push({ name: value, done: false });
  input.value = '';
  save();
  render();
  playAdd();
}

document.getElementById('add-btn').addEventListener('click', addItem);
document.getElementById('item-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addItem();
});
document.getElementById('clear-btn').addEventListener('click', () => {
  items = items.filter(i => !i.done);
  save();
  render();
  playOtterComplete();
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
